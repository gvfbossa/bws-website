<section id="about" class="w-full text-white py-24 px-6 md:px-12">
  <div class="max-w-7xl mx-auto flex flex-col items-center gap-12">
    <!-- TITULO -->
    <div class="text-center flex flex-col gap-4">
      <h1 class="text-3xl md:text-5xl font-extrabold leading-snug">
        BOAS-VINDAS AO
        <span
          class="bg-gradient-to-r from-[#0052cc] to-[#66b2ff] bg-clip-text text-transparent"
        >
          SEU <br class="block md:hidden" />
          SUCESSO DIGITAL
        </span>
      </h1>

      <div class="relative w-full max-w-3xl mx-auto mt-2 h-10 md:h-12">
        <span
          *ngFor="let word of animatedWords; let i = index"
          class="md:absolute top-0 font-bold md:text-2xl text-sm whitespace-nowrap transition-all duration-700 ease-in-out text-white"
          [ngStyle]="{
            left: isMobile ? i * 50 + '%' : i * 28 + '%',
          }"
          [ngClass]="{
            'word-active': currentWordIndex === i,
            'word-ghost': currentWordIndex !== i,
          }"
        >
          {{ word }}
          <span class="md:hidden" style="opacity: 0;">_</span>
        </span>
      </div>
    </div>

    <!-- IMAGEM + PAINEL -->
    <div class="relative w-full grid grid-cols-1 md:grid-cols-[1fr_auto] items-center gap-16">
      <!-- COLUNA DA IMAGEM (CENTRALIZADA) -->
      <div class="flex justify-center">
        <img
          src="assets/images/about_main.png"
          alt="Boas Vindas à Bossa Web Solutions"
          class="rounded-3xl shadow-2xl w-full block md:max-w-[50rem] transition-transform duration-500 hover:scale-105"
        />
      </div>

      <!-- PAINEL DA LISTA -->
      <div
        class="md:ml-12 md:w-[300px] md:rounded-3xl bg-gradient-to-b from-white/5 to-white/0 backdrop-blur-xl border border-white/10 shadow-[0_30px_80px_-30px_rgba(0,0,0,0.9)] p-4 md:p-6"
      >
        <ul class="flex flex-col gap-6">
          <li
            *ngFor="let topic of topics"
            (click)="toggleTopic(topic)"
            class="group cursor-pointer transition-all duration-300 hover:translate-x-1 hover:bg-white/[0.02] rounded-xl p-2 -m-2"
          >
            <!-- HEADER -->
            <div class="flex justify-between items-center">
              <h2
                class="text-sm uppercase tracking-widest transition-all duration-300 text-white/60 group-hover:text-white"
                [class.text-white]="topic.expanded"
                [class.font-semibold]="topic.expanded"
              >
                {{ topic.name }}
              </h2>

              <mat-icon
                class="text-[#66b2ff] opacity-40 transition-all duration-300 group-hover:opacity-100 group-hover:scale-110"
                [class.rotate-90]="topic.expanded"
              >
                chevron_right
              </mat-icon>
            </div>

            <!-- INDICADOR -->
            <div
              class="h-px mt-3 bg-gradient-to-r from-[#66b2ff]/0 via-[#66b2ff] to-[#66b2ff]/0 opacity-0 blur-[0.5px] transition-all duration-300"
              [class.opacity-100]="topic.expanded"
            ></div>

            <!-- SUBITENS -->
            <ul
              class="mt-4 space-y-2 text-sm text-gray-400 max-h-0 overflow-hidden transition-all duration-300"
              [class.max-h-40]="topic.expanded"
            >
              <li
                *ngFor="let item of topic.items"
                class="flex items-center gap-3"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-[#66b2ff]/70"></span>
                <span>{{ item }}</span>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <!-- TEXTO FINAL -->
    <div class="flex flex-col items-center gap-4 md:mt-10">
      <div
        class="w-24 h-px bg-gradient-to-r from-transparent via-[#66b2ff]/60 to-transparent"
      ></div>

      <p
        class="mt-6 text-center leading-snug text-xl md:leading-relaxed text-white/80 max-w-xl"
      >
        Transformamos ideias em <b class="text-white">sites</b>,
        <b class="text-white">sistemas</b> e <b class="text-white">apps</b> sob
        medida.
        <span class="block mt-2 text-gray-500">
          Soluções inteligentes e profissionais para seu negócio crescer.
        </span>
      </p>
    </div>
  </div>
</section>
